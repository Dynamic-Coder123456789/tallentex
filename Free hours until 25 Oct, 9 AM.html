:root{--a:#000;--af:#fff;--am:rgba(255,255,255,.56);--al:rgba(255,255,255,.28);--b:#fff;--bf:#000;--bm:rgba(0,0,0,.55);--bl:#000;
--px:"Geist Pixel","Fragment Mono",ui-monospace,monospace;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b:#0b0b0b;--bf:#e8e6e0;--bm:rgba(232,230,224,.55);--bl:rgba(232,230,224,.5)}}
:root[data-theme="dark"]{--b:#0b0b0b;--bf:#e8e6e0;--bm:rgba(232,230,224,.55);--bl:rgba(232,230,224,.5)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--a);color:var(--af);font-family:var(--mono);overflow-x:hidden;-webkit-font-smoothing:antialiased}
.hero{position:relative;display:flex;min-height:100vh;background:var(--a)}
.hl{width:40%;min-width:340px;padding:40px clamp(20px,2.8vw,40px);display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1}
.hr{position:relative;flex:1;background:var(--a);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.eye{font-size:11px;line-height:1.6;letter-spacing:.18em;text-transform:uppercase;color:var(--am);margin:0 0 22px}
h1{font-family:var(--px);font-weight:400;font-size:clamp(36px,4.6vw,110px);line-height:1;letter-spacing:.015em;margin:0;font-variant-numeric:tabular-nums}
.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--am);margin:10px 0 0}
.clk{font-family:var(--px);font-size:clamp(22px,2.6vw,38px);line-height:1.2;margin-top:48px;font-variant-numeric:tabular-nums;white-space:nowrap}
.clk .dm{color:var(--am)}
@media(max-width:900px){
 .hl{width:100%;min-width:0;background:transparent;min-height:100vh}
 .hr{position:absolute;inset:0;opacity:.4;pointer-events:none}
 h1{font-size:clamp(36px,14vw,110px)}
 .clk{font-size:clamp(22px,7vw,38px)}
}
</style>
</head>
<body><section class="hero">
 <div class="hl">
  <p class="eye">Until 25 Oct · 09:00 IST</p>
  <h1 id="n1">000:00:00</h1>
  <p class="lbl">Free time left (h:m:s)</p>
  <div class="clk" id="clk">00D 00H 00M 00S</div>
  <p class="lbl">On the clock</p>
 </div>
 <div class="hr"><canvas id="cv" aria-hidden="true"></canvas></div>
</section>

<script>
const IST="+05:30",T=new Date("2026-10-25T09:00:00"+IST).getTime(),S=new Date("2026-10-05T00:00:00"+IST).getTime();
const DAY=864e5,H=36e5,FR=24-8-6.5-2; // 7.5 free hours per day
const $=id=>document.getElementById(id),p2=n=>String(n).padStart(2,"0");
let prog=0;
function tick(){
 const now=Date.now(),ms=Math.max(0,T-now);prog=Math.min(1,Math.max(0,(now-S)/(T-S)));
 const fs=Math.floor(ms/1e3*FR/24);
 $("n1").textContent=String(Math.floor(fs/3600)).padStart(3,"0")+":"+p2(Math.floor(fs%3600/60))+":"+p2(fs%60);
 const d=Math.floor(ms/DAY),hh=Math.floor(ms%DAY/H),mm=Math.floor(ms%H/6e4),ss=Math.floor(ms%6e4/1e3);
 $("clk").innerHTML='<span class="dm">'+p2(d)+"D "+p2(hh)+"H "+p2(mm)+"M</span> "+p2(ss)+"S";
}
tick();setInterval(tick,250);

// ASCII moon, ported from the React AsciiCanvas. Light now follows the clock: full at the start, dark at 25 Oct.
const MOON=" `.-':_,^=;><+!rc*/z?sLTv)J7(|Fi{C}fI31tlu[neoZ5Yxjya]2ESwqkP6h9d4VpOGbUAKXHm8RD#$Bg0MNWQ%&@";
const FIELD="  ..::--==++**##@@".split("");
const hash=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453123;return s-Math.floor(s)};
const sm=t=>t*t*(3-2*t);
const noise=(x,y)=>{const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,a=hash(ix,iy),b=hash(ix+1,iy),c=hash(ix,iy+1),d=hash(ix+1,iy+1),ux=sm(fx),uy=sm(fy);
 return a*(1-ux)*(1-uy)+b*ux*(1-uy)+c*(1-ux)*uy+d*ux*uy};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const cv=$("cv"),ctx=cv.getContext("2d"),calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
let W=0,Hh=0,cols=0,rows=0,time=0,last=0;const mouse={x:-1e3,y:-1e3};
function resize(){const p=cv.parentElement;W=p.offsetWidth;Hh=p.offsetHeight;const dpr=Math.min(2,devicePixelRatio||1);
 cv.width=W*dpr;cv.height=Hh*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 cols=W<768?90:128;const cw=W/cols;rows=Math.ceil(Hh/(cw*1.18));draw(0)}
addEventListener("mousemove",e=>{const r=cv.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top});
function draw(dt){
 ctx.fillStyle="#0A0A0A";ctx.fillRect(0,0,W,Hh);time+=dt/1000*.72;
 const cw=W/cols,ch=cw*1.18,mx=W*.5,my=Hh*.5,mr=Math.min(W,Hh)*.24;
 ctx.font=(ch*.84)+'px "Fragment Mono",monospace';ctx.textAlign="center";ctx.textBaseline="middle";
 const th=prog*Math.PI;let lx=Math.sin(th),ly=.15,lz=Math.cos(th);const ll=Math.hypot(lx,ly,lz);lx/=ll;ly/=ll;lz/=ll;
 const ang=time*.32,ca=Math.cos(ang),sa=Math.sin(ang),lane=1.75;
 for(let r=0;r<rows;r++){const y=r*ch+ch/2,ln=y/Hh;
  for(let c=0;c<cols;c++){const x=c*cw+cw/2,dx=x-mx,dy=y-my,nm=Math.hypot(dx,dy)/mr,am=Math.atan2(dy,dx);
   const mf=Math.exp(-Math.hypot(x-mouse.x,y-mouse.y)*.0038);let ch0="",op=0,X=x,Y=y;
   if(nm<1){const lX=dx/mr,lY=-dy/mr,z=Math.sqrt(Math.max(0,1-lX*lX-lY*lY));
    const px=lX*ca-z*sa,py=lY,pz=lX*sa+z*ca;let df=Math.max(0,px*lx+py*ly+pz*lz);
    const maria=noise(px*2.6+4.2,py*2.6-1.7)*.6+noise(pz*3.4-8.1,py*3.4+5.4)*.4;
    const cr=noise(px*12+py*6+30,pz*12-px*4-20)*.65+noise(px*20-11,py*20+7)*.35;
    const alb=cl(.76+cr*.14-maria*.18,.52,.92);
    if(df>0&&df<.15)df=Math.max(0,df+Math.sin(px*50+py*50)*.03);
    const it=.015+df*alb*1.3,ix=cl(Math.floor(it*(MOON.length-1)),0,MOON.length-1);
    ch0=MOON[ix];op=cl(.2+it*.82,.2,1);
    if(ix<2&&nm>.95){ch0=".";op=.3}
    const eb=Math.exp(-Math.abs(nm-1)*8)*4;X+=-Math.sin(am)*eb;Y+=Math.cos(am)*eb*.4;
    X+=Math.sin(time*3.6+r*.32+c*.11)*mf*16;Y+=Math.cos(time*2.8+c*.24)*mf*5;
   }else{
    const sx=c*.085-time*(1.8+lane*1.6)+Math.sin(time*4.2+r*.28+c*.08)*mf*1.8;
    const sy=r*.11+Math.sin(c*.025+time*1.2)*.6+Math.cos(time*3.4+c*.2)*mf*1.1;
    const fa=noise(sx,sy),fb=noise(sx*1.7+20,sy*.8-14),wv=Math.sin(sx*1.9+ln*14)*.5+Math.cos(sy*2.4-time*2.1)*.5;
    let den=fa*.42+fb*.28+(wv*.5+.5)*.3;const ob=Math.exp(-Math.pow((nm-1.12)*5.5,2));den+=ob*.16;
    if(den>.38){ch0=FIELD[cl(Math.floor(den*(FIELD.length-1)),0,FIELD.length-1)];op=.035+den*.24;
     X+=(lane*8+fb*16)%(cw*3);Y+=Math.sin(sx*2.2+time+ln*8)*1.8;
     const sw=ob*10;X+=-Math.sin(am)*sw;Y+=Math.cos(am)*sw*.6;
     X+=Math.sin(time*4.8+r*.35+c*.1)*mf*18;Y+=Math.cos(time*3.2+c*.25)*mf*6}
   }
   if(!ch0||op<=.02)continue;
   ctx.fillStyle="rgba(232,230,224,"+op.toFixed(3)+")";ctx.fillText(ch0,X,Y)}}
}
function loop(t){if(t-last>=30){draw(Math.min(100,t-last));last=t}requestAnimationFrame(loop)}
function start(){resize();if(!calm)requestAnimationFrame(loop)}
(document.fonts&&document.fonts.load?Promise.race([document.fonts.load('12px "Fragment Mono"'),new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(start);
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv.parentElement);else addEventListener("resize",resize);
</script>
